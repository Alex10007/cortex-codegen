name: Cortex CI (authorized Windows runner)

on:
  workflow_dispatch:
    inputs:
      authorize_windows_execution:
        description: "I reviewed this exact PR #1 branch commit and authorize test execution on my Windows self-hosted runner. This does not qualify the Linux sandbox."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cortex-pr1-windows-authorized-runner
  cancel-in-progress: false

jobs:
  windows-test:
    if: github.actor == 'Alex10007' && github.ref == 'refs/heads/vibe/cortex-core-b71b2c' && inputs.authorize_windows_execution == true
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed PR #1 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Windows runner preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          whoami
          $PSVersionTable
          python --version
          python -m pip --version
          Get-PSDrive -PSProvider FileSystem
          python -c "import os, platform; print('OS:', platform.platform()); print('CPU count:', os.cpu_count())"
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is not set' }
          if (-not $env:GITHUB_WORKSPACE) { throw 'GITHUB_WORKSPACE is not set' }

      - name: Create job-local virtual environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'cortex-venv'
          python -m venv $venv
          "$venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record immutable evidence baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'cortex-evidence.before'
          $files = @(git ls-files -- artifacts VERIFICATION*.md)
          if ($files.Count -eq 0) { throw 'No tracked evidence files found' }
          $hashes = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $hashes | Set-Content -LiteralPath $baseline -Encoding utf8

      - name: Install dependencies and run complete verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
          python -m compileall -q cortex scripts tests
          python -m pytest --collect-only -q tests/
          python -m pytest -q tests/

      - name: Verify evidence and repository remained unchanged
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'cortex-evidence.before'
          if (Test-Path -LiteralPath $baseline) {
            $failures = @()
            foreach ($line in Get-Content -LiteralPath $baseline) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed evidence record: $line" }
              $expected = $Matches[1]
              $path = $Matches[2]
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                $failures += "Missing evidence file: $path"
                continue
              }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { $failures += "Evidence changed: $path" }
            }
            if ($failures.Count -gt 0) { $failures | ForEach-Object { Write-Error $_ }; throw 'Evidence integrity check failed' }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree changes detected' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Staged working-tree changes detected' }
          $untracked = @(git ls-files --others --exclude-standard)
          if ($untracked.Count -gt 0) { $untracked | ForEach-Object { Write-Error $_ }; throw 'Untracked files detected' }
