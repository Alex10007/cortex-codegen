name: Cortex Legacy Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cortex-legacy-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify legacy entrypoint syntax only
        run: python -m py_compile app.py
