name: Cortex CI (isolated self-hosted)

on:
  push:
    branches: [main, "vibe/**", "fibonera/**"]

# This workflow intentionally does not run for pull_request events.
# The self-hosted laptop runner must never execute code from arbitrary forks.
permissions:
  contents: read

concurrency:
  group: cortex-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Register the ephemeral WSL runner with the exact cortex-wsl label.
    runs-on: [self-hosted, linux, x64, cortex-wsl]
    timeout-minutes: 90
    steps:
      - name: Checkout trusted repository push
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runner preflight
        run: |
          set -euxo pipefail
          uname -a
          python --version
          python -m pip --version
          df -h .
          python - <<'PY'
          import os
          print("CPU count:", os.cpu_count())
          with open("/proc/meminfo", encoding="utf-8") as f:
              print("\n".join(line.rstrip() for line in f if line.startswith(("MemTotal:", "MemAvailable:"))))
          PY

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m pytest -q tests/
