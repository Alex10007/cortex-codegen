name: CI + Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, "fibonera/**"]
  pull_request:
    # PR #2 targets the Stage-15 remediation base, not main.
    branches: [main, "vibe/cortex-core-b71b2c"]
  workflow_dispatch:

# Avoid queuing one hosted runner per rapid commit. A newer push/PR update
# supersedes an older run for the same source branch.
concurrency:
  group: cortex-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q tests/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "Cortex Codegen"
          git config --global user.email "cortex-codegen@agent.ai"
          git remote set-url origin https://CortexCodegen:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/alex10007/cortex-codegen
          git push origin main
