name: Cortex CI (restricted WSL runner)

on:
  # Manual dispatch only. Review the exact branch and commit before authorizing
  # execution on the owner-controlled self-hosted laptop runner.
  workflow_dispatch:
    inputs:
      authorize_self_hosted_execution:
        description: "I reviewed this branch and authorize code execution on the isolated WSL runner."
        required: true
        type: boolean
        default: false

# No push or pull_request trigger. Never run untrusted PR code on the laptop runner.
permissions:
  contents: read

concurrency:
  group: cortex-stage16a-self-hosted
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == 'Alex10007' && github.ref == 'refs/heads/fibonera/cortex-remediation-stage16a' && inputs.authorize_self_hosted_execution
    runs-on: [self-hosted, linux, x64, cortex-wsl]
    timeout-minutes: 90
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create job-local Python environment
        run: |
          set -euxo pipefail
          python -m venv "$RUNNER_TEMP/cortex-venv"
          echo "$RUNNER_TEMP/cortex-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/cortex-venv" >> "$GITHUB_ENV"

      - name: Runner preflight
        run: |
          set -euxo pipefail
          id
          uname -a
          python --version
          python -m pip --version
          df -h .
          python - <<'PY'
          import os
          print("CPU count:", os.cpu_count())
          with open("/proc/meminfo", encoding="utf-8") as f:
              print("\n".join(line.rstrip() for line in f if line.startswith(("MemTotal:", "MemAvailable:"))))
          PY
          if mountpoint -q /mnt/c; then
            echo "Refusing CI: Windows C: is mounted inside this WSL environment."
            exit 1
          fi
          test -n "$VIRTUAL_ENV"
          python -c 'import sys; assert sys.prefix != sys.base_prefix, sys.prefix'

      - name: Record immutable evidence baseline
        run: |
          set -euxo pipefail
          git ls-files -z -- artifacts 'VERIFICATION*.md' |
            xargs -0 -r sha256sum > "$RUNNER_TEMP/cortex-evidence.before"
          if [ ! -s "$RUNNER_TEMP/cortex-evidence.before" ]; then
            echo "No tracked Cortex evidence files found."
          else
            echo "Captured immutable evidence fingerprints:"
            wc -l "$RUNNER_TEMP/cortex-evidence.before"
          fi

      - name: Install dependencies and execute the full suite
        run: |
          set -euxo pipefail
          test_count="$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | wc -l)"
          if [ "$test_count" -eq 0 ]; then
            echo "No discoverable test modules found."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
          python -m compileall -q cortex tests
          python -m pytest --collect-only -q tests/
          python -m pytest -q tests/

      - name: Verify evidence and repository were not modified
        if: always()
        run: |
          set -euxo pipefail
          if [ -f "$RUNNER_TEMP/cortex-evidence.before" ]; then
            sha256sum --check "$RUNNER_TEMP/cortex-evidence.before"
          fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
