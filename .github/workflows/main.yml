name: Cortex CI (authorized isolated WSL runner)

on:
  workflow_dispatch:
    inputs:
      authorize_self_hosted_execution:
        description: "I reviewed this exact PR #1 branch commit and authorize execution on the isolated WSL runner."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cortex-pr1-stage16-authorized-runner
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == 'Alex10007' && github.ref == 'refs/heads/vibe/cortex-core-b71b2c' && inputs.authorize_self_hosted_execution == true
    runs-on: [self-hosted, linux, x64, cortex-wsl]
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed PR #1 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create job-local virtual environment
        run: |
          set -euxo pipefail
          python -m venv "$RUNNER_TEMP/cortex-venv"
          echo "$RUNNER_TEMP/cortex-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/cortex-venv" >> "$GITHUB_ENV"

      - name: Runner isolation preflight
        run: |
          set -euxo pipefail
          id
          uname -a
          python --version
          python -m pip --version
          df -h .
          python -c 'import os; print("CPU count:", os.cpu_count())'
          if mountpoint -q /mnt/c; then
            echo "Refusing execution: Windows C: is mounted in this WSL runner."
            exit 1
          fi
          test -n "$VIRTUAL_ENV"
          python -c 'import sys; assert sys.prefix != sys.base_prefix, sys.prefix'

      - name: Record immutable evidence baseline
        run: |
          set -euxo pipefail
          git ls-files -z -- artifacts 'VERIFICATION*.md' |
            xargs -0 -r sha256sum > "$RUNNER_TEMP/cortex-evidence.before"
          test -s "$RUNNER_TEMP/cortex-evidence.before"

      - name: Install dependencies and run complete verification
        run: |
          set -euxo pipefail
          test_count="$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | wc -l)"
          test "$test_count" -gt 0
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
          python -m compileall -q cortex scripts tests
          python -m pytest --collect-only -q tests/
          python -m pytest -q tests/

      - name: Verify evidence and repository remained unchanged
        if: always()
        run: |
          set -euxo pipefail
          if [ -f "$RUNNER_TEMP/cortex-evidence.before" ]; then
            sha256sum --check "$RUNNER_TEMP/cortex-evidence.before"
          fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
