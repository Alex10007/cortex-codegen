name: Cortex CI

on:
  push:
    branches: [main, "fibonera/**"]
  pull_request:
    # PR #2 targets the Stage-15 remediation base, not main.
    branches: [main, "vibe/cortex-core-b71b2c"]
  workflow_dispatch:

# Avoid queuing one hosted runner per rapid commit. A newer push/PR update
# supersedes an older run for the same source branch.
concurrency:
  group: cortex-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q tests/
